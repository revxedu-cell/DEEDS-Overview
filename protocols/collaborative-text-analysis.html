<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Collaborative Reading — DEEDS Examine Protocol</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Open+Sans:wght@300;400;700&display=swap" rel="stylesheet">
<style>

:root {
  --phase:#0a7a14; --phase-light:#e8f7ea; --phase-mid:#bbf7d0; --phase-dark:#065f0c;
  --amber:#F59E0B; --amber-light:#FEF3C7;
  --text:#072b0a; --text-mid:#3d6b43; --text-soft:#6b9b72;
  --border:#d4ead6; --bg:#f0faf1; --white:#fff;
  --m-ind-bg:#EFF6FF; --m-ind-b:#BFDBFE; --m-ind-t:#1D4ED8;
  --m-pair-bg:#F0FDF4; --m-pair-b:#BBF7D0; --m-pair-t:#15803D;
  --m-sm-bg:#FAF5FF; --m-sm-b:#DDD6FE; --m-sm-t:#6D28D9;
  --m-wh-bg:#FFF7ED; --m-wh-b:#FED7AA; --m-wh-t:#C2410C;
  --t-bg:#072b0a; --t-s:rgba(255,255,255,.06); --t-l:rgba(255,255,255,.09);
  --t-text:rgba(255,255,255,.88); --t-soft:rgba(255,255,255,.55);
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Open Sans',sans-serif; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; }

/* ── TOPBAR ── */
.topbar {
  position:sticky; top:0; z-index:50; background:white;
  border-bottom:1px solid var(--border);
  padding:9px 20px; display:flex; align-items:center;
  justify-content:space-between; gap:10px; flex-wrap:wrap;
}
.tl { display:flex; align-items:center; gap:9px; }
.back-btn {
  display:inline-flex; align-items:center; gap:5px;
  font-family:'Oswald',sans-serif; font-weight:700; font-size:12px;
  color:var(--text-soft); text-decoration:none; padding:5px 10px 5px 6px;
  border-radius:0; border:1.5px solid var(--border); background:white; transition:all .15s;
}
.back-btn:hover { border-color:var(--phase); color:var(--phase); }
.phase-pill { font-family:'Oswald',sans-serif; font-weight:700; font-size:11px; letter-spacing:.15em; color:white; background:var(--phase); padding:4px 11px; border-radius:0; }
.deck-label { font-family:'Oswald',sans-serif; font-weight:700; font-size:13px; color:var(--text-mid); }
.ctrl-area { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.tg { display:flex; background:var(--bg); border-radius:0; padding:2px; gap:1px; }
.tb { font-family:'Oswald',sans-serif; font-weight:700; font-size:11px; padding:4px 10px; border:none; border-radius:0; cursor:pointer; background:transparent; color:var(--text-soft); transition:all .15s; }
.tb.active { background:var(--phase); color:white; }

/* subject toggle — slightly larger */
.subj-tg { display:flex; background:var(--bg); border-radius:0; padding:2px; gap:1px; }
.subj-tb { font-family:'Oswald',sans-serif; font-weight:700; font-size:11px; padding:5px 11px; border:none; border-radius:0; cursor:pointer; background:transparent; color:var(--text-soft); transition:all .15s; white-space:nowrap; }
.subj-tb.active { background:var(--phase); color:white; box-shadow:0 1px 4px rgba(10,122,20,.35); }

/* phase nav — only shown in CR mode */
.phase-nav { display:none; align-items:center; gap:6px; }
body.subj-cr .phase-nav { display:flex; }
body.subj-css .phase-nav { display:flex; }
.nav-btn { width:30px; height:30px; border-radius:0; border:1.5px solid var(--border); background:white; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--text-mid); font-size:13px; transition:all .15s; }
.nav-btn:hover:not(:disabled) { border-color:var(--phase); color:var(--phase); }
.nav-btn:disabled { opacity:.3; cursor:not-allowed; }
.slide-ctr { font-family:'Oswald',sans-serif; font-weight:700; font-size:12px; color:var(--text-mid); min-width:54px; text-align:center; white-space:nowrap; }

/* band toggles — hidden for CS/CSS */
.band-tg { display:none; }
body.subj-cr .band-tg,
body.subj-cta .band-tg,
body.subj-css .band-tg { display:flex; }

/* ── PAGE LAYOUT ── */
.page { max-width:1080px; margin:24px auto; padding:0 20px 40px; }

/* subject panels */
.subj-panel { display:none; }
body.subj-cr  .subj-panel.cr  { display:block; }
body.subj-cta .subj-panel.cta { display:block; }
body.subj-css .subj-panel.css { display:block; }

/* CR phase slides */
.cr-slide { display:none; }
.cr-slide.active { display:block; }
.cs-slide { display:none; }
.cs-slide.active { display:block; }
.css-slide { display:none; }
.css-slide.active { display:block; }

/* ── STUDENT CARD ── */
.sc { background:white; border-radius:0; box-shadow:0 2px 20px rgba(0,0,0,.08),0 0 0 1px rgba(0,0,0,.04); overflow:hidden; min-height:520px; display:none; flex-direction:column; }
body.subj-cr.vs  #cr-panel .sc,
body.subj-cta.vs #cs-panel .sc,
body.subj-css.vs #css-panel .sc { display:flex; }

.sh { flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; padding:13px 24px; border-bottom:1px solid #f0f7f1; }
.shl { display:flex; align-items:center; gap:9px; }
.type-badge { font-family:'Oswald',sans-serif; font-weight:700; font-size:10px; letter-spacing:.1em; padding:4px 10px; border-radius:0; text-transform:uppercase; }
.badge-r { color:#3d6b43; background:var(--phase-light); border:1px solid var(--phase-mid); }
.badge-f { color:var(--phase-dark); background:var(--phase-light); border:1px solid var(--phase-mid); }
.phase-num-badge { font-family:'Oswald',sans-serif; font-weight:700; font-size:10px; letter-spacing:.1em; padding:4px 11px; border-radius:0; text-transform:uppercase; color:white; background:var(--phase-dark); }
.timer { font-family:'Oswald',sans-serif; font-weight:700; font-size:13.5px; color:var(--text-mid); }

/* band variants */
.bv { display:none; flex-direction:column; flex:1; min-height:0; }
/* scope bv rules to active panel only */
body.subj-cr.bk2  #cr-panel .bv[data-b="k2"],
body.subj-cta.bk2 #cs-panel .bv[data-b="k2"],
body.subj-css.bk2 #css-panel .bv[data-b="k2"]  { display:flex; }
body.subj-cr.b35  #cr-panel .bv[data-b="35"],
body.subj-cta.b35 #cs-panel .bv[data-b="35"],
body.subj-css.b35 #css-panel .bv[data-b="35"]  { display:flex; }
body.subj-cr.b612  #cr-panel .bv[data-b="612"],
body.subj-cta.b612 #cs-panel .bv[data-b="612"],
body.subj-css.b612 #css-panel .bv[data-b="612"]  { display:flex; }

.sb { flex:1; min-height:0; display:flex; flex-direction:column; padding:18px 24px 14px; }
.s-phase-label { font-family:'Oswald',sans-serif; font-weight:700; font-size:10px; letter-spacing:.15em; text-transform:uppercase; color:var(--phase); margin-bottom:4px; flex-shrink:0; }
.s-title { font-family:'Oswald',sans-serif; font-weight:700; font-size:36px; color:var(--text); line-height:1.05; margin-bottom:5px; flex-shrink:0; }
.s-sub { font-size:16px; font-weight:600; color:var(--text-mid); margin-bottom:14px; flex-shrink:0; }

/* cards row */
.cr { flex:1; min-height:0; display:flex; align-items:stretch; gap:0; }
.cw { flex:1; display:flex; }
.pc { flex:1; border-radius:10px; padding:12px 10px 10px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:5px; overflow:hidden; }
.pd { border:1px solid var(--border); border-top:3px solid var(--phase); }
.pr { border:1px solid var(--border); border-top:3px solid #86efac; background:#f8fff9; }
.card-arrow { flex:0 0 18px; display:flex; align-items:center; justify-content:center; color:var(--phase); font-size:15px; font-weight:700; flex-shrink:0; }
.cm { display:flex; align-items:center; justify-content:space-between; width:100%; }
.mode-pill { font-family:'Oswald',sans-serif; font-weight:700; font-size:11px; letter-spacing:.05em; padding:2px 6px; border-radius:0; white-space:nowrap; }
.m-ind  { background:var(--m-ind-bg);  border:1px solid var(--m-ind-b);  color:var(--m-ind-t); }
.m-pair { background:var(--m-pair-bg); border:1px solid var(--m-pair-b); color:var(--m-pair-t); }
.m-sm   { background:var(--m-sm-bg);   border:1px solid var(--m-sm-b);   color:var(--m-sm-t); }
.m-wh   { background:var(--m-wh-bg);   border:1px solid var(--m-wh-b);   color:var(--m-wh-t); }
.c-time { font-family:'Oswald',sans-serif; font-weight:700; font-size:10px; color:var(--text-soft); }
.c-icon { font-size:30px; line-height:1; flex-shrink:0; }
.c-label { font-family:'Oswald',sans-serif; font-weight:700; font-size:17px; color:var(--text); flex-shrink:0; }
.c-prompt { font-size:14px; color:var(--text-mid); line-height:1.4; }
.c-starter { font-size:12.5px; color:var(--text-soft); font-style:italic; line-height:1.35; }
.annot-key { display:flex; flex-wrap:wrap; gap:3px; justify-content:center; margin-top:2px; }
.ak { font-family:'Oswald',sans-serif; font-weight:700; font-size:9px; background:#f0f7f1; border:1px solid var(--phase-mid); color:var(--phase-dark); border-radius:0; padding:2px 5px; }

/* phase stepper dots */
.phase-dots { display:flex; justify-content:center; gap:8px; padding:12px 0 0; }
.phase-dot { width:28px; height:6px; border-radius:3px; background:var(--phase-mid); cursor:pointer; transition:all .2s; }
.phase-dot.active { background:var(--phase); width:36px; }

/* ── TEACHER CARD ── */
.tc2 { background:var(--t-bg); border-radius:0; box-shadow:0 2px 20px rgba(0,0,0,.2); overflow:hidden; min-height:560px; display:none; flex-direction:column; }
body.vt.subj-cr  #cr-panel .tc2 { display:flex; }
body.vt.subj-cta #cs-panel .tc2 { display:flex; }
body.vt.subj-css #css-panel .tc2 { display:flex; }
.t-hdr { flex:0 0 auto; background:var(--phase); padding:15px 24px; display:flex; align-items:flex-start; justify-content:space-between; gap:14px; }
.t-hdr-l { display:flex; flex-direction:column; gap:3px; }
.t-ey { font-family:'Oswald',sans-serif; font-weight:700; font-size:10px; letter-spacing:.18em; color:rgba(255,255,255,.75); text-transform:uppercase; }
.t-ttl { font-family:'Oswald',sans-serif; font-weight:700; font-size:20px; color:white; }
.t-meta { display:flex; flex-direction:column; align-items:flex-end; gap:2px; background:rgba(0,0,0,.15); border-radius:0; padding:7px 12px; flex-shrink:0; }
.t-ml { font-family:'Oswald',sans-serif; font-weight:700; font-size:9px; letter-spacing:.12em; color:rgba(255,255,255,.6); text-transform:uppercase; }
.t-mv { font-family:'Oswald',sans-serif; font-weight:700; font-size:12px; color:white; }
.t-body { flex:1; padding:14px 24px 18px; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr auto auto; gap:12px; }
.t-sec { background:var(--t-s); border-radius:9px; padding:12px 13px; overflow:hidden; }
.t-sec-title { font-family:'Oswald',sans-serif; font-weight:700; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--phase-mid); margin-bottom:8px; }
.h-row { display:flex; align-items:flex-start; gap:8px; padding:6px 0; border-bottom:1px solid var(--t-l); }
.h-row:last-of-type { border-bottom:none; padding-bottom:0; }
.h-badge { flex-shrink:0; background:rgba(10,122,20,.25); border:1px solid rgba(10,122,20,.4); border-radius:0; padding:3px 6px; text-align:center; min-width:42px; }
.h-d { font-family:'Oswald',sans-serif; font-weight:700; font-size:11.5px; color:#86efac; line-height:1; }
.h-lbl { font-family:'Oswald',sans-serif; font-weight:700; font-size:7px; color:rgba(134,239,172,.7); letter-spacing:.05em; }
.h-name { font-family:'Oswald',sans-serif; font-weight:700; font-size:12px; color:#86efac; margin-bottom:2px; }
.h-rat { font-size:11px; color:var(--t-soft); line-height:1.35; }
.g-row { display:flex; align-items:flex-start; gap:7px; padding:4px 0; border-bottom:1px solid var(--t-l); }
.g-row:last-child { border-bottom:none; padding-bottom:0; }
.g-band { font-family:'Oswald',sans-serif; font-weight:700; font-size:9px; letter-spacing:.08em; color:var(--phase-mid); background:rgba(10,122,20,.18); border-radius:3px; padding:2px 6px; white-space:nowrap; flex-shrink:0; margin-top:1px; }
.g-note { font-size:11px; color:var(--t-soft); line-height:1.4; }
.fac-list { list-style:none; display:flex; flex-direction:column; gap:4px; overflow:auto; }
.fac-list li { font-size:11.5px; color:var(--t-soft); line-height:1.4; padding-left:12px; position:relative; }
.fac-list li::before { content:'›'; position:absolute; left:0; color:var(--phase-mid); font-weight:700; }
.why-box { grid-column:1/-1; border-left:3px solid var(--phase-mid); background:rgba(10,122,20,.1); border-radius:0 9px 9px 0; padding:10px 13px; }
.why-l { font-family:'Oswald',sans-serif; font-weight:700; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--phase-mid); margin-bottom:3px; }
.why-t { font-size:12.5px; color:var(--t-text); line-height:1.55; }
.std-row { grid-column:1/-1; display:flex; align-items:flex-start; gap:8px; padding-top:9px; border-top:1px solid var(--t-l); }
.std-l { font-family:'Oswald',sans-serif; font-weight:700; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--phase-mid); white-space:nowrap; padding-top:1px; }
.std-v { font-size:11px; color:var(--t-soft); line-height:1.45; }


/* ── PHASE BOXES ── */
.all-phases { display:flex; align-items:stretch; gap:0; overflow-x:auto; padding-bottom:4px; }
.phase-box { flex:1; min-width:170px; max-width:260px; border:0.5px solid var(--border); border-top:3px solid var(--phase); background:#fff; display:flex; flex-direction:column; padding:12px 13px 14px; gap:6px; }
.phase-box-hdr { display:flex; align-items:baseline; gap:6px; flex-wrap:wrap; }
.phase-box-num { font-family:'Oswald',sans-serif; font-weight:700; font-size:9px; letter-spacing:.15em; text-transform:uppercase; color:var(--phase); white-space:nowrap; flex-shrink:0; }
.phase-box-name { font-family:'Oswald',sans-serif; font-weight:700; font-size:14px; color:var(--text); line-height:1.1; flex:1; }
.phase-box-time { font-family:'Oswald',sans-serif; font-weight:500; font-size:10px; color:var(--text-soft); white-space:nowrap; }
.phase-box-desc { font-size:12px; color:var(--text-mid); line-height:1.5; margin:0; }
.phase-arrow { flex:0 0 22px; display:flex; align-items:center; justify-content:center; font-size:16px; color:var(--phase); flex-shrink:0; align-self:center; }
/* Reference chips */
.ref-chips { display:flex; flex-wrap:wrap; gap:4px; margin-top:2px; }
.ref-label { width:100%; font-family:'Oswald',sans-serif; font-size:8px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--text-soft); margin-bottom:1px; }
.chip { font-size:10px; line-height:1.4; padding:3px 7px; border-radius:0; }
.chip-annot { background:rgba(10,122,20,.07); border:0.5px solid rgba(10,122,20,.2); color:var(--phase-dark); font-weight:600; }
.chip-starter { background:var(--bg); border:0.5px solid var(--border); color:var(--text-mid); font-style:italic; }
.chip-q { background:rgba(0,61,166,.05); border:0.5px solid rgba(0,61,166,.18); color:#003da6; }

/* ── PLACEHOLDER PANEL ── */
.t-phases-scroll { flex:1; overflow-y:auto; padding:12px 16px; display:flex; flex-direction:column; gap:12px; }
.t-phase-block { border:1px solid var(--t-l); border-radius:0; overflow:hidden; }
.t-phase-hdr { background:rgba(255,255,255,.07); padding:8px 12px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.t-phase-num { font-family:'Oswald',sans-serif; font-weight:700; font-size:9px; letter-spacing:.15em; text-transform:uppercase; color:var(--phase-mid); background:rgba(10,122,20,.2); padding:2px 7px; white-space:nowrap; }
.t-phase-name { font-family:'Oswald',sans-serif; font-weight:700; font-size:13px; color:white; flex:1; }
.t-std { font-size:9px; color:var(--t-soft); font-style:italic; white-space:nowrap; }
.t-phase-body { padding:10px 12px; display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.t-phase-body .why-box { grid-column:1/-1; }
.placeholder-panel { background:white; border-radius:0; box-shadow:0 2px 20px rgba(0,0,0,.08),0 0 0 1px rgba(0,0,0,.04); padding:48px 40px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:16px; }
.ph-icon { font-size:48px; }
.ph-title { font-family:'Oswald',sans-serif; font-weight:700; font-size:24px; color:var(--text); }
.ph-sub { font-size:15px; color:var(--text-mid); max-width:420px; line-height:1.55; }
.ph-tag { font-family:'Oswald',sans-serif; font-weight:700; font-size:11px; letter-spacing:.12em; color:var(--text-soft); background:var(--phase-light); border:1px solid var(--phase-mid); padding:4px 12px; border-radius:0; }

@media print {
  .topbar { display:none; }
  .page { margin:0; padding:0; max-width:100%; }
  .cr-slide { display:block !important; page-break-after:always; }
  .cs-slide { display:block !important; page-break-after:always; }
  .sc,.tc2 { display:flex !important; box-shadow:none; border-radius:0; }
  body.vs .tc2, body.vt .sc { display:none !important; }
}

.print-btn {
  font-family:'Oswald',sans-serif; font-weight:500; font-size:11px;
  letter-spacing:.1em; text-transform:uppercase;
  padding:5px 12px; border:1px solid var(--border);
  background:white; color:var(--text-mid); cursor:pointer;
  display:inline-flex; align-items:center; gap:6px; transition:all .15s;
  border-radius:0; white-space:nowrap;
}
.print-btn:hover { border-color:var(--phase); color:var(--phase); }
.print-btn svg { flex-shrink:0; }
</style>
</head>
<body class="vs bk2 subj-cr">

<div class="topbar">
  <div class="tl">
    <a class="back-btn" href="../examine.html">&#8592; Examine</a>
    <span class="phase-pill">EXAMINE</span>
    <span class="deck-label" id="deck-label">Collaborative Reading</span>
  </div>
  <div class="ctrl-area">

    <!-- Subject toggle -->
    <div class="subj-tg">
      <button class="subj-tb active" id="bscr"  onclick="setSubject('cr')">Reading</button>
      <button class="subj-tb"        id="bscs"  onclick="setSubject('cs')">Science</button>
      <button class="subj-tb"        id="bscss" onclick="setSubject('css')">Social Studies</button>
    </div>

    <!-- Phase nav — hidden, all phases on one slide -->
    <div class="phase-nav" id="phase-nav" style="display:none!important">
      <button class="nav-btn" id="prev-btn" onclick="prevPhase()" disabled>&#8592;</button>
      <span class="slide-ctr" id="slide-ctr">Phase 1 of 5</span>
      <button class="nav-btn" id="next-btn" onclick="nextPhase()">&#8594;</button>
    </div>

    <!-- Student / Teacher -->
    <div class="tg">
      <button class="tb active" id="bvs" onclick="setView('s')">Student</button>
      <button class="tb"        id="bvt" onclick="setView('t')">Teacher</button>
    </div>

    <!-- Grade band -->
    <div class="tg band-tg">
      <button class="tb active" id="bbk2" onclick="setBand('k2')">K–2</button>
      <button class="tb"        id="bb35" onclick="setBand('35')">3–5</button>
      <button class="tb" id="bb612" onclick="setBand('612')">6–12</button>
    </div>
    <button class="print-btn" onclick="window.print()" title="Save as PDF">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      Save as PDF
    </button>
  </div>
</div>

<div class="page">

  <!-- ══ COLLABORATIVE READING PANEL ══ -->
  <div class="subj-panel cr" id="cr-panel"></div>

  <!-- ══ COLLABORATIVE SCIENCE PANEL ══ -->
  <div class="subj-panel cta" id="cs-panel"></div>

  <!-- ══ COLLABORATIVE SOCIAL STUDIES PANEL ══ -->
  <div class="subj-panel css" id="css-panel"></div>

</div><!-- /page -->

<script>
// ── COLLABORATIVE READING ─────────────────────────────────────────────────
const CR_PHASES = [
{
  num:1, name:'Read & Identify the Central Idea',
  bands:{
    k2:  { time:'10 min', desc:'Read together twice. What is this text mainly about?',
           starters:['The text is mainly about…','I know because…'] },
    '35':{ time:'10 min', desc:'Read twice. Use a strategy to find the main idea. Annotate key details.',
           starters:['The central idea is…','I used the [strategy] strategy because…','Evidence: paragraph…'] },
    '612':{ time:'10 min', desc:'Read independently. What is the central idea, and how does the author develop it?',
            starters:['The central idea is…','The author develops this by…','The detail that most convinced me was…'] }
  }
,
  teacher: {

    why: `Every week of Collaborative Social Studies ends with the question that matters most: what does this mean for how we live and act in our community?`,
    std: `NYS SS: Civic Participation · CCSS SL.1 · SL.4`
  }
}
]; // end CSS_PHASES


function buildPhaseBox(ph, band) {
  const b = ph.bands[band];
  if(!b) return '';
  const annotChips = b.annot
    ? '<div class="ref-chips annot-chips">' + b.annot.map(a=>`<span class="chip chip-annot">${a}</span>`).join('') + '</div>' : '';
  const starterChips = b.starters
    ? '<div class="ref-chips"><div class="ref-label">Starters</div>' + b.starters.map(s=>`<span class="chip chip-starter">${s}</span>`).join('') + '</div>' : '';
  const qChips = b.questions
    ? '<div class="ref-chips"><div class="ref-label">Sample questions</div>' + b.questions.map(q=>`<span class="chip chip-q">${q}</span>`).join('') + '</div>' : '';
  return `<div class="phase-box">
    <div class="phase-box-hdr">
      <span class="phase-box-num">Phase ${ph.num}</span>
      <span class="phase-box-name">${ph.name}</span>
      <span class="phase-box-time">${b.time}</span>
    </div>
    <p class="phase-box-desc">${b.desc}</p>
    ${annotChips}${starterChips}${qChips}
  </div>`;
}

function buildAllBandSteps(phases, band) {
  return phases.map((ph, i) => {
    const box = buildPhaseBox(ph, band);
    const arrow = i < phases.length - 1 ? '<div class="phase-arrow">\u2192</div>' : '';
    return box + arrow;
  }).join('');
}

function buildBvSlot(phases, band) {
  return `<div class="bv" data-b="${band}">
    <div class="sb">
      <div class="all-phases">${buildAllBandSteps(phases, band)}</div>
    </div>
  </div>`;
}

function buildTeacherPanel(phases, subject, bands) {
  const phaseCards = phases.map(ph => {
    const t = ph.teacher;
    if(!t) return '';
    const gKeys = [{k:'k2',l:'K\u20132'},{k:'35',l:'3\u20135'},{k:'612',l:'6\u201312'}];
    const grows = gKeys.map(g=>`<div class="g-row"><span class="g-band">${g.l}</span><span class="g-note">${(t.grade&&t.grade[g.k])||''}</span></div>`).join('');
    const facNotes = (t.notes||[]).map(n=>`<li>${n}</li>`).join('');
    return `<div class="t-phase-block">
      <div class="t-phase-hdr">
        <span class="t-phase-num">Phase ${ph.num}</span>
        <span class="t-phase-name">${ph.name}</span>
        <span class="t-std">${t.std||''}</span>
      </div>
      <div class="t-phase-body">
        <div class="t-sec"><div class="t-sec-title">Grade Band Guidance</div>${grows}</div>
        <div class="t-sec"><div class="t-sec-title">Facilitation Notes</div><ul class="fac-list">${facNotes}</ul></div>
        <div class="why-box"><div class="why-l">Why this phase</div><div class="why-t">${t.why||''}</div></div>
      </div>
    </div>`;
  }).join('');
  return `<div class="tc2">
    <div class="t-hdr">
      <div class="t-hdr-l">
        <div class="t-ey">Teacher Background</div>
        <div class="t-ttl">${subject}</div>
      </div>
    </div>
    <div class="t-phases-scroll">${phaseCards}</div>
  </div>`;
}

function buildPanel(phases, panelId, subject, slideClass, panelPrefix) {
  const panel = document.getElementById(panelId);
  const bands = ['k2','35','612'];
  const bvSlots = bands.map(b => buildBvSlot(phases, b)).join('');
  panel.innerHTML = `
    <div class="sc">
      <div class="sh">
        <div class="shl">
          <span class="phase-pill">EXAMINE</span>
          <span class="type-badge badge-r">${subject}</span>
        </div>
        <div class="timer">\u23F1\u202F~10\u201315 min / phase</div>
      </div>
      ${bvSlots}
    </div>
    ${buildTeacherPanel(phases, subject, bands)}`;
}










function setSubject(s) {
  document.body.className = document.body.className.replace(/\bsubj-\w+\b/g,'').trim()
    + ' subj-' + (s==='cs' ? 'cta' : s==='css' ? 'css' : 'cr');
  ['cr','cs','css'].forEach(x => {
    const btn = document.getElementById('bs'+x);
    if(btn) btn.classList.toggle('active', x===s);
  });
  const labels = { cr:'Collaborative Reading', cs:'Collaborative Science', css:'Collaborative Social Studies' };
  document.getElementById('deck-label').textContent = labels[s] || 'Collaborative Reading';
}

function setView(v) {
  document.body.classList.toggle('vs', v==='s');
  document.body.classList.toggle('vt', v==='t');
  document.getElementById('bvs').classList.toggle('active', v==='s');
  document.getElementById('bvt').classList.toggle('active', v==='t');
}

function setBand(b) {
  document.body.className = document.body.className.replace(/\bb(k2|35|612)\b/g,'').trim() + ' b' + b;
  ['k2','35','612'].forEach(x => {
    const btn = document.getElementById('bb'+x);
    if(btn) btn.classList.toggle('active', x===b);
  });
}

document.addEventListener('keydown', e => {
  if(e.key==='ArrowRight' || e.key==='ArrowLeft') return;
});

// Build all panels on load
buildPanel(CR_PHASES,  'cr-panel',  'Collaborative Reading',        'cr-slide', 'cr');
buildPanel(CS_PHASES,  'cs-panel',  'Collaborative Science (STEM)', 'cs-slide', 'cs');
buildPanel(CSS_PHASES, 'css-panel', 'Collaborative Social Studies', 'css-slide','css');

</script>
