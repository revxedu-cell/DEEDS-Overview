<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Socratic Seminar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Oswald:wght@700&display=swap" rel="stylesheet">
<style>
:root { --phase:#0a7a14; --phase-mid:#0a7a14; --phase-dark:#065c0f; }


:root {
  --phase:#0a7a14; --phase-light:#e8f7ea; --phase-mid:#bbf7d0; --phase-dark:#065f0c;
  --amber:#F59E0B; --amber-light:#FEF3C7;
  --text:#072b0a; --text-mid:#3d6b43; --text-soft:#6b9b72;
  --border:#d4ead6; --bg:#f0faf1; --white:#fff;
  --m-ind-bg:#EFF6FF; --m-ind-b:#BFDBFE; --m-ind-t:#1D4ED8;
  --m-pair-bg:#F0FDF4; --m-pair-b:#BBF7D0; --m-pair-t:#15803D;
  --m-sm-bg:#FAF5FF; --m-sm-b:#DDD6FE; --m-sm-t:#6D28D9;
  --m-wh-bg:#FFF7ED; --m-wh-b:#FED7AA; --m-wh-t:#C2410C;
  --t-bg:#072b0a; --t-s:rgba(255,255,255,.06); --t-l:rgba(255,255,255,.09);
  --t-text:rgba(255,255,255,.88); --t-soft:rgba(255,255,255,.55);
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Open Sans',sans-serif; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; }

/* ── TOPBAR ── */
.topbar {
  position:sticky; top:0; z-index:50; background:white;
  border-bottom:1px solid var(--border);
  padding:9px 20px; display:flex; align-items:center;
  justify-content:space-between; gap:12px; flex-wrap:wrap;
}
.tl { display:flex; align-items:center; gap:9px; }
.phase-pill { font-family:'Oswald',sans-serif; font-weight:700; font-size:11px; letter-spacing:.15em; color:white; background:var(--phase); padding:4px 11px; border-radius:0; }
.deck-label { font-family:'Oswald',sans-serif; font-weight:700; font-size:13px; color:var(--text-mid); }
.nav-area { display:flex; align-items:center; gap:9px; }
.nav-btn { width:32px; height:32px; border-radius:0; border:1.5px solid var(--border); background:white; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--text-mid); font-size:14px; transition:all .15s; }
.nav-btn:hover:not(:disabled) { border-color:var(--phase); color:var(--phase); }
.nav-btn:disabled { opacity:.3; cursor:not-allowed; }
.slide-ctr { font-family:'Oswald',sans-serif; font-weight:700; font-size:13px; color:var(--text-mid); min-width:40px; text-align:center; }
.ctrl-area { display:flex; align-items:center; gap:8px; }
.tg { display:flex; background:var(--bg); border-radius:0; padding:2px; gap:1px; }
.tb { font-family:'Oswald',sans-serif; font-weight:700; font-size:11px; padding:4px 10px; border:none; border-radius:0; cursor:pointer; background:transparent; color:var(--text-soft); transition:all .15s; }
.tb.active { background:var(--phase); color:white; }

/* ── PAGE LAYOUT ── */
.page { max-width:1080px; margin:24px auto; padding:0 20px 40px; }
.slide { display:none; }
.slide.active { display:block; }

/* ── STUDENT CARD ── */
.sc { background:white; border-radius:0; box-shadow:0 2px 20px rgba(0,0,0,.08),0 0 0 1px rgba(0,0,0,.04); overflow:hidden; height:560px; display:none; flex-direction:column; }
body.vs .sc { display:flex; }
.sh { flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; padding:13px 24px; border-bottom:1px solid #f0f7f1; }
.shl { display:flex; align-items:center; gap:9px; }
.type-badge { font-family:'Oswald',sans-serif; font-weight:700; font-size:10px; letter-spacing:.1em; padding:4px 10px; border-radius:0; text-transform:uppercase; }
.badge-r { color:#3d6b43; background:var(--phase-light); border:1px solid var(--phase-mid); }
.badge-f { color:var(--phase-dark); background:var(--phase-light); border:1px solid var(--phase-mid); }
.timer { font-family:'Oswald',sans-serif; font-weight:700; font-size:13.5px; color:var(--text-mid); }

/* band variants */
.bv { display:none; flex-direction:column; flex:1; min-height:0; }
body.bk2  .bv[data-b="k2"]  { display:flex; }
body.b35   .bv[data-b="35"] { display:flex; }
body.b68   .bv[data-b="68"] { display:flex; }
body.b912  .bv[data-b="912"]{ display:flex; }
body.b612  .bv[data-b="612"]{ display:flex; }

.sb { flex:1; min-height:0; display:flex; flex-direction:column; padding:18px 24px 10px; }
.s-title { font-family:'Oswald',sans-serif; font-weight:700; font-size:40px; color:var(--text); line-height:1.1; margin-bottom:5px; flex-shrink:0; }
.s-sub { font-size:19px; font-weight:600; color:var(--text-mid); margin-bottom:16px; flex-shrink:0; }

/* cards row */
.cr { flex:1; min-height:0; display:flex; align-items:stretch; }
.cw { flex:1; display:flex; }
.pc { flex:1; border-radius:10px; padding:12px 10px 10px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px; overflow:hidden; }
.pd { border:1px solid var(--border); border-top:3px solid var(--phase); }
.pr { border:1px solid var(--border); border-top:3px solid #86efac; background:#f8fff9; }
.card-arrow { flex:0 0 20px; display:flex; align-items:center; justify-content:center; color:var(--phase); font-size:16px; font-weight:700; flex-shrink:0; }
.cm { display:flex; align-items:center; justify-content:space-between; width:100%; }
.mode-pill { font-family:'Oswald',sans-serif; font-weight:700; font-size:12px; letter-spacing:.05em; padding:2px 6px; border-radius:0; white-space:nowrap; }
.m-ind  { background:var(--m-ind-bg);  border:1px solid var(--m-ind-b);  color:var(--m-ind-t); }
.m-pair { background:var(--m-pair-bg); border:1px solid var(--m-pair-b); color:var(--m-pair-t); }
.m-sm   { background:var(--m-sm-bg);   border:1px solid var(--m-sm-b);   color:var(--m-sm-t); }
.m-wh   { background:var(--m-wh-bg);   border:1px solid var(--m-wh-b);   color:var(--m-wh-t); }
.c-time { font-family:'Oswald',sans-serif; font-weight:700; font-size:10px; color:var(--text-soft); }
.c-icon { font-size:34px; line-height:1; flex-shrink:0; }
.c-label { font-family:'Oswald',sans-serif; font-weight:700; font-size:20px; color:var(--text); flex-shrink:0; }
.c-prompt { font-size:17px; color:var(--text-mid); line-height:1.4; }
.c-starter { font-size:15px; color:var(--text-soft); font-style:italic; line-height:1.35; }
/* annotation key badge */
.annot-key { display:flex; flex-wrap:wrap; gap:4px; justify-content:center; margin-top:2px; }
.ak { font-family:'Oswald',sans-serif; font-weight:700; font-size:9.5px; background:#f0f7f1; border:1px solid var(--phase-mid); color:var(--phase-dark); border-radius:0; padding:2px 6px; }

/* ── TEACHER CARD ── */
.tc2 { background:var(--t-bg); border-radius:0; box-shadow:0 2px 20px rgba(0,0,0,.2); overflow:hidden; min-height:560px; display:none; flex-direction:column; }
body.vt .tc2 { display:flex; }
.t-hdr { flex:0 0 auto; background:var(--phase); padding:15px 24px; display:flex; align-items:flex-start; justify-content:space-between; gap:14px; }
.t-hdr-l { display:flex; flex-direction:column; gap:3px; }
.t-ey { font-family:'Oswald',sans-serif; font-weight:700; font-size:10px; letter-spacing:.18em; color:rgba(255,255,255,.75); text-transform:uppercase; }
.t-ttl { font-family:'Oswald',sans-serif; font-weight:700; font-size:21px; color:white; }
.t-meta { display:flex; flex-direction:column; align-items:flex-end; gap:2px; background:rgba(0,0,0,.15); border-radius:0; padding:7px 12px; flex-shrink:0; }
.t-ml { font-family:'Oswald',sans-serif; font-weight:700; font-size:9px; letter-spacing:.12em; color:rgba(255,255,255,.6); text-transform:uppercase; }
.t-mv { font-family:'Oswald',sans-serif; font-weight:700; font-size:12px; color:white; }
.t-body { flex:1; padding:14px 24px 18px; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr auto auto; gap:12px; }
.t-sec { background:var(--t-s); border-radius:9px; padding:12px 13px; overflow:hidden; }
.t-sec-title { font-family:'Oswald',sans-serif; font-weight:700; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--phase-mid); margin-bottom:8px; }
.h-row { display:flex; align-items:flex-start; gap:8px; padding:6px 0; border-bottom:1px solid var(--t-l); }
.h-row:last-of-type { border-bottom:none; padding-bottom:0; }
.h-badge { flex-shrink:0; background:rgba(10,122,20,.25); border:1px solid rgba(10,122,20,.4); border-radius:0; padding:3px 6px; text-align:center; min-width:42px; }
.h-d { font-family:'Oswald',sans-serif; font-weight:700; font-size:11.5px; color:#86efac; line-height:1; }
.h-lbl { font-family:'Oswald',sans-serif; font-weight:700; font-size:7px; color:rgba(134,239,172,.7); letter-spacing:.05em; }
.h-name { font-family:'Oswald',sans-serif; font-weight:700; font-size:12px; color:#86efac; margin-bottom:2px; }
.h-rat { font-size:11px; color:var(--t-soft); line-height:1.35; }
.g-row { display:flex; align-items:flex-start; gap:7px; padding:4px 0; border-bottom:1px solid var(--t-l); }
.g-row:last-child { border-bottom:none; padding-bottom:0; }
.g-band { font-family:'Oswald',sans-serif; font-weight:700; font-size:9px; letter-spacing:.08em; color:var(--phase-mid); background:rgba(10,122,20,.18); border-radius:3px; padding:2px 6px; white-space:nowrap; flex-shrink:0; margin-top:1px; }
.g-note { font-size:11px; color:var(--t-soft); line-height:1.4; }
.plan-note { background:rgba(255,255,255,.04); border:1px solid var(--t-l); border-radius:0; padding:8px 11px; margin-top:8px; }
.plan-title { font-family:'Oswald',sans-serif; font-weight:700; font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:rgba(255,255,255,.4); margin-bottom:3px; }
.plan-txt { font-size:11px; color:var(--t-soft); line-height:1.4; }
.why-box { grid-column:1/-1; border-left:3px solid var(--phase-mid); background:rgba(10,122,20,.1); border-radius:0 9px 9px 0; padding:10px 13px; }
.why-l { font-family:'Oswald',sans-serif; font-weight:700; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--phase-mid); margin-bottom:3px; }
.why-t { font-size:12.5px; color:var(--t-text); line-height:1.55; }
.std-row { grid-column:1/-1; display:flex; align-items:flex-start; gap:8px; padding-top:9px; border-top:1px solid var(--t-l); }
.std-l { font-family:'Oswald',sans-serif; font-weight:700; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--phase-mid); white-space:nowrap; padding-top:1px; }
.std-v { font-size:11px; color:var(--t-soft); line-height:1.45; }

@media print {
  .topbar { display:none; }
  .page { margin:0; padding:0; max-width:100%; }
  .slide { display:block !important; page-break-after:always; }
  .sc,.tc2 { display:flex !important; box-shadow:none; border-radius:0; }
  body.vs .tc2, body.vt .sc { display:none !important; }
}

/* ── COVER SLIDE ── */
.cover-slide {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-height:calc(100vh - 56px);
  background:linear-gradient(145deg,#065f0c 0%,#0a7a14 50%,#16a34a 100%);
  position:relative; overflow:hidden; text-align:center; padding:40px;
}
.cover-slide::before {
  content:''; position:absolute; inset:0;
  background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/svg%3E");
}
.cv-badge {
  font-weight:700; font-size:11px; letter-spacing:3px;
  background:rgba(255,255,255,.2); color:#fff; padding:6px 18px;
  border-radius:0; text-transform:uppercase; margin-bottom:28px;
  border:1px solid rgba(255,255,255,.35); position:relative;
}
.cv-title {
  font-family:'Oswald',sans-serif; font-weight:700; font-size:90px;
  color:#fff; line-height:.9; letter-spacing:-2px; position:relative;
}
.cv-sub {
  font-size:22px; font-weight:700; color:rgba(255,255,255,.85);
  margin-top:18px; letter-spacing:.5px; position:relative;
}
.cv-logo {
  position:absolute; bottom:32px; right:36px;
  display:flex; align-items:center; gap:10px;
}
.cv-logo-text {
  font-size:10px; font-weight:700; color:rgba(255,255,255,.6);
  letter-spacing:1.5px; text-transform:uppercase; text-align:right; line-height:1.4;
}
.cv-logo img { width:56px; height:56px; border-radius:50%; object-fit:cover; }

/* ── Individual protocol page overrides ── */
.slide { display:block; }
.back-btn {
  display:inline-flex; align-items:center; gap:5px;
  font-family:'Oswald',sans-serif; font-weight:700; font-size:12px;
  color:var(--text-soft); text-decoration:none; padding:5px 10px 5px 6px;
  border-radius:0; border:1.5px solid var(--border); background:white;
  transition:all .15s;
}
.back-btn:hover { border-color:var(--phase); color:var(--phase); }

.print-btn {
  font-family:'Oswald',sans-serif; font-weight:500; font-size:11px;
  letter-spacing:.1em; text-transform:uppercase;
  padding:5px 12px; border:1px solid var(--border);
  background:white; color:var(--text-mid); cursor:pointer;
  display:inline-flex; align-items:center; gap:6px; transition:all .15s;
  border-radius:0; white-space:nowrap;
}
.print-btn:hover { border-color:var(--phase); color:var(--phase); }
.print-btn svg { flex-shrink:0; }

.student-when { display:flex; align-items:flex-start; gap:10px; padding:9px 24px; background:rgba(0,0,0,.04); border-bottom:1px solid rgba(0,0,0,.08); flex-shrink:0; }
.student-when-icon { font-size:14px; margin-top:1px; flex-shrink:0; }
.student-when-text { font-size:12.5px; color:var(--phase); line-height:1.4; font-weight:600; }

</style>
</head>
<body class="vs bk2">

<div class="topbar">
  <div class="tl">
    <a class="back-btn" href="../examine.html">&#8592; Examine</a>
    <span class="phase-pill">EXAMINE</span>
    <span class="deck-label">Socratic Seminar</span>
  </div>
  <div class="ctrl-area">
    <div class="tg">
      <button class="tb active" id="bvs" onclick="setView('s')">Student</button>
      <button class="tb"        id="bvt" onclick="setView('t')">Teacher</button>
    </div>
    <div class="tg">
      <button class="tb active" id="bbk2"  onclick="setBand('k2')">K–2</button>
      <button class="tb"        id="bb35"  onclick="setBand('35')">3–5</button>
      <button class="tb"        id="bb612" onclick="setBand('612')">6–12</button>
    </div>
  </div>
</div>

<div class="page">
  <div id="slide0"></div>
</div>

<script>

const MC = { individual:'m-ind', pair:'m-pair', small:'m-sm', whole:'m-wh' };
const ML = { individual:'✏️ Individual', pair:'👥 Partner', small:'◎ Small Group', whole:'◎ Whole Class' };

const P = [
{
  id:'ss', type:'focus', name:'Socratic Seminar', bands4:false,
  timer:{ k2:'15–20 min', '35':'20–25 min', '612':'25–30 min' },
  purpose:{
    k2:   'Listen, share your thinking, and learn from what your classmates say.',
    '35': 'Share your ideas, ask questions, and build understanding together.',
    '612':'Develop and defend a position, challenge ideas with evidence, and let the discussion shift your thinking.'
  },
  bands:{
    k2:[
      { mode:'whole', time:'3–4 min', icon:'📚', label:'Prepare',
        prompt:'Your teacher will read the text or question aloud. Draw or tell one idea you have and one question you wonder about.',
        starter:'One thing I think is… / One thing I wonder is…' },
      { mode:'whole', time:'2 min', icon:'💡', label:'Open',
        prompt:'Share one thing you noticed or thought about. Everyone listens without interrupting.',
        starter:'I noticed… / I think…' },
      { mode:'whole', time:'8–10 min', icon:'🗣️', label:'Discuss',
        prompt:'Talk directly to each other. Ask questions, add on, and respectfully disagree. You do not need to raise your hand.',
        starter:'I agree with ___ because… / I want to add… / What do you mean by…?' },
      { mode:'whole', time:'2 min', icon:'✅', label:'Reflect',
        prompt:'What did we learn? Did we listen well to each other?',
        starter:'Something I learned is… / Next time we could…' }
    ],
    '35':[
      { mode:'individual', time:'5–6 min', icon:'📚', label:'Prepare',
        prompt:'Read and annotate the text. Write one idea you have in response to the central question and one question you want to discuss.',
        starter:'My idea is… / I want to ask…' },
      { mode:'pair', time:'2 min', icon:'👥', label:'Open',
        prompt:'Share your idea and question with a partner. Then the class opens: share one idea or question you are ready to discuss.',
        starter:'' },
      { mode:'whole', time:'10–12 min', icon:'🗣️', label:'Discuss',
        prompt:'Build on each other’s ideas. Ask questions, add evidence, and respectfully push back. Speak directly to one another by name.',
        starter:'I agree with ___ because… / I want to build on… / What evidence do you have for…?' },
      { mode:'pair', time:'2–3 min', icon:'✅', label:'Reflect',
        prompt:'What shifted in your thinking? What do you still wonder? Then share one takeaway with the class.',
        starter:'My thinking shifted because… / I still wonder…' }
    ],
    '612':[
      { mode:'individual', time:'5–7 min', icon:'📚', label:'Prepare',
        prompt:'Read, annotate, and develop an initial claim in response to the central question. Select 2–3 pieces of evidence and write 2 inquiry questions to bring to the discussion.',
        starter:'' },
      { mode:'whole', time:'2–3 min', icon:'👥', label:'Open',
        prompt:'Assign roles: Facilitator, Process Observer, Summarizer. Each person states their initial claim and one key piece of evidence briefly.',
        starter:'My initial position is… because…' },
      { mode:'whole', time:'12–15 min', icon:'🗣️', label:'Discuss',
        prompt:'Ask questions, challenge ideas, and extend each other’s thinking. Refer to evidence. Be willing to revise your position.',
        starter:'Building on what ___ said… / What evidence supports…? / I want to push back on…' },
      { mode:'individual', time:'2–3 min', icon:'✅', label:'Reflect',
        prompt:'Write: what changed in your thinking, and what is still unresolved? How well did we practice our norms?',
        starter:'' }
    ]
  },
  teacher:{
    when:'Mid-Examine to synthesize evidence around root causes, or in Step 3 to deliberate about solutions', type:'Focus Protocol',
    studentWhen:'Use this to build shared understanding of a complex question by thinking out loud together.',
    hattie:[
      { d:'0.82', n:'Classroom Discussion',    r:'Structured discussion with evidence and student-generated questions is among the highest-leverage instructional practices.' },
      { d:'0.64', n:'Self-Questioning',         r:'Preparing inquiry questions before the seminar activates prior knowledge and sharpens focus during discussion.' },
      { d:'0.60', n:'Metacognitive Strategies', r:'The reflect step asks students to monitor how their thinking shifted, building the habit of intellectual revision.' }
    ],
    principal: null,
    grade:{
      k2:   'Keep it whole class with you facilitating. Post the central question visually. Accept drawn responses during prep. Model how to add on to someone’s idea before students try it.',
      '35': 'The pair prep step matters — students who share their idea with one person first speak more confidently in the whole-class discussion. Push students to use names when responding to each other.',
      '68': 'Assign roles explicitly and debrief them. The Process Observer role is especially valuable — it surfaces participation patterns students often don’t notice.',
      '912':'Expect students to revise their claims during the discussion, not just defend them. A student whose position has not changed by the end may not be listening deeply enough.'
    },
    planning:'The central question should be genuinely open — no single right answer, real complexity, and directly connected to the challenge. Avoid questions that can be resolved with a single piece of evidence. For Step 2 (root causes), a strong frame is: “What is the most significant cause of this challenge, and why?” For Step 3 (solutions): “What would an effective solution need to do, and what tradeoffs are we willing to accept?”',
    why:'Examine requires students to move from accumulating evidence to making meaning across it. The Socratic Seminar creates the conditions for that move: students have to articulate their thinking, hear competing interpretations, and revise their positions in real time. Without structured discussion, the inquiry work of Examine can remain isolated in individual notebooks rather than becoming shared understanding.',
    std:'CCSS SL.1, SL.3 · NGSS SEP 7 · C3 D4'
  }
}
];

function buildCard(step, isRoutine) {
  const dc = isRoutine ? 'pr' : 'pd';
  const mc = MC[step.mode] || 'm-wh';
  const ml = ML[step.mode] || step.mode;
  const starter = step.starter ? `<div class="c-starter">${step.starter}</div>` : '';
  const annotKey = step.annot ? `<div class="annot-key">${step.annot.map(a=>`<span class="ak">${a}</span>`).join('')}</div>` : '';
  return `<div class="cw"><div class="pc ${dc}">
    <div class="cm"><span class="mode-pill ${mc}">${ml}</span><span class="c-time">\u23F3\u202F${step.time}</span></div>
    <div class="c-icon">${step.icon}</div>
    <div class="c-label">${step.label}</div>
    <div class="c-prompt">${step.prompt}</div>
    ${annotKey}${starter}
  </div></div>`;
}

function buildBand(proto, band) {
  const ir = proto.type === 'routine';
  let cards = '';
  proto.bands[band].forEach((s, i) => {
    cards += buildCard(s, ir);
    if (i < proto.bands[band].length - 1) cards += `<div class="card-arrow">\u203A</div>`;
  });
  return `<div class="bv" data-b="${band}">
    <div class="sb">
      <div class="s-title">${proto.name}</div>
            <div class="cr">${cards}</div>
    </div>
  </div>`;
}

function buildTeacher(proto) {
  const t = proto.teacher;
  const hrows = t.hattie.map(h=>`<div class="h-row">
    <div class="h-badge"><div class="h-d">d=${h.d}</div><div class="h-lbl">Hattie</div></div>
    <div><div class="h-name">${h.n}</div><div class="h-rat">${h.r}</div></div>
  </div>`).join('');
  const gKeys = [
    {k:'k2',l:'K\u20132'},{k:'35',l:'3\u20135'},
    {k:'68',l:'6\u20138'},{k:'912',l:'9\u201312'}
  ];
  const grows = gKeys.map(g=>`<div class="g-row">
    <span class="g-band">${g.l}</span>
    <span class="g-note">${t.grade[g.k]}</span>
  </div>`).join('');
  const planNote = t.planning ? `<div class="plan-note">
    <div class="plan-title">Planning Notes</div>
    <div class="plan-txt">${t.planning}</div>
  </div>` : '';
  return `<div class="tc2">
    <div class="t-hdr">
      <div class="t-hdr-l">
        <div class="t-ey">Teacher Background \u2014 Examine</div>
        <div class="t-ttl">${proto.name}</div>
      </div>
      <div class="t-meta">
        <div class="t-ml">When to use</div><div class="t-mv">${t.when}</div>
        <div class="t-ml" style="margin-top:4px">Type</div><div class="t-mv">${t.type}</div>
      </div>
    </div>
    <div class="t-body">
      <div class="t-sec"><div class="t-sec-title">Hattie Effect Sizes</div>${hrows}</div>
      <div class="t-sec"><div class="t-sec-title">Grade Band Guidance</div>${grows}${planNote}</div>
      <div class="why-box"><div class="why-l">Why this, why now</div><div class="why-t">${t.why}</div></div>
      <div class="std-row"><div class="std-l">Standards</div><div class="std-v">${t.std}</div></div>
    </div>
  </div>`;
}

function buildAll() {
  const ir = P[0].type === 'routine';
  const bc = ir ? 'badge-r' : 'badge-f';
  const bl = ir ? 'Daily Routine' : 'Focus Protocol';
  const allBands = ['k2','35','612'];
  const bvs = allBands.map(b => buildBand(P[0], b)).join('');
  document.getElementById('slide0').innerHTML = `
    <div class="sc">
      <div class="sh">
        <div class="shl">
          <span class="phase-pill">EXAMINE</span>
          <span class="type-badge ${bc}">${bl}</span>
        </div>
        <div class="timer" id="tmr0">\u23F1\u202F${P[0].timer['k2']}</div>
      </div>
      ${P[0].teacher.studentWhen ? `<div class="student-when"><span class="student-when-icon">💡</span><span class="student-when-text">${P[0].teacher.studentWhen}</span></div>` : ""}
      ${bvs}
    </div>
    ${buildTeacher(P[0])}`;
}

buildAll();

function setView(v) {
  document.body.classList.toggle('vs', v === 's');
  document.body.classList.toggle('vt', v === 't');
  document.getElementById('bvs').classList.toggle('active', v === 's');
  document.getElementById('bvt').classList.toggle('active', v === 't');
}

function setBand(b) {
  document.body.className = document.body.className.replace(/\bb(k2|35|612|68|912)\b/g,'').trim() + ' b' + b;
  ['k2','35','612'].forEach(x => {
    const btn = document.getElementById('bb'+x);
    if(btn) btn.classList.toggle('active', x === b);
  });
  const el = document.getElementById('tmr0');
  if(el) el.textContent = '\u23F1\u202F' + (P[0].timer[b] || P[0].timer['35'] || P[0].timer['k2']);
}
document.addEventListener('keydown', e => {
  if(e.key==='ArrowLeft'||e.key==='ArrowRight') return;
});

</script>
