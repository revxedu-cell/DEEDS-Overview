<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Uncovering the Challenge: DEEDS Discover Protocol</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Open+Sans:wght@300;400;700&display=swap" rel="stylesheet">
<style>

:root {
  --phase:#e69138; --phase-light:#fdf1e2; --phase-mid:#f2cd9e; --phase-dark:#a4661f;
  --amber:#F59E0B; --amber-light:#FEF3C7;
  --text:#333333; --text-mid:#44403C; --text-soft:#78716C;
  --border:#E7E5E4; --bg:#F5F4F2; --white:#fff;
  --m-ind-bg:#EFF6FF;  --m-ind-b:#BFDBFE;  --m-ind-t:#1D4ED8;
  --m-pair-bg:#F0FDF4; --m-pair-b:#BBF7D0; --m-pair-t:#15803D;
  --m-sm-bg:#FAF5FF;   --m-sm-b:#DDD6FE;   --m-sm-t:#6D28D9;
  --m-wh-bg:#FFF7ED;   --m-wh-b:#FED7AA;   --m-wh-t:#C2410C;
  --t-bg:#1C1917; --t-s:rgba(255,255,255,.06); --t-l:rgba(255,255,255,.09);
  --t-text:rgba(255,255,255,.88); --t-soft:rgba(255,255,255,.55);
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Open Sans',sans-serif; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; }

/* ── TOPBAR ── */
.topbar {
  position:sticky; top:0; z-index:50; background:white;
  border-bottom:1px solid var(--border);
  padding:9px 20px; display:flex; align-items:center;
  justify-content:space-between; gap:12px; flex-wrap:wrap;
}
.tl { display:flex; align-items:center; gap:9px; }
.phase-pill {
  font-family:'Oswald',sans-serif; font-weight:700; font-size:13px;
  letter-spacing:.15em; color:white; background:var(--phase);
  padding:5px 13px; border-radius:0;
}
.deck-label { font-family:'Oswald',sans-serif; font-weight:700; font-size:13px; color:var(--text-mid); }
.deck-timer { font-family:'Oswald',sans-serif; font-weight:600; font-size:12px; color:var(--text-soft); }
.topbar-logo { height:22px; width:auto; flex-shrink:0; }

/* When embedded in the phase-page drawer: hide the back link (it would  */
/* navigate the iframe, not the parent) and tighten spacing since the    */
/* panel is narrower than the page's normal width                       */
body.in-drawer .back-btn { display:none; }
body.in-drawer .topbar-logo { display:none; }
body.in-drawer .deck-label { display:none; }
body.in-drawer .topbar { padding:7px 16px; gap:8px; }
body.in-drawer .ctrl-area { gap:6px; }
body.in-drawer .tb { padding:4px 8px; font-size:10px; }
body.in-drawer .print-btn { padding:4px 8px; font-size:11px; }
body.in-drawer .page { max-width:100%; margin:14px auto; padding:0 14px 24px; }
.nav-area { display:flex; align-items:center; gap:9px; }
.nav-btn {
  width:32px; height:32px; border-radius:0; border:1.5px solid var(--border);
  background:white; cursor:pointer; display:flex; align-items:center;
  justify-content:center; color:var(--text-mid); font-size:14px; transition:all .15s;
}
.nav-btn:hover:not(:disabled) { border-color:var(--phase); color:var(--phase); }
.nav-btn:disabled { opacity:.3; cursor:not-allowed; }
.slide-ctr { font-family:'Oswald',sans-serif; font-weight:700; font-size:13px; color:var(--text-mid); min-width:40px; text-align:center; }
.ctrl-area { display:flex; align-items:center; gap:8px; }
.tg { display:flex; background:var(--bg); border-radius:0; padding:2px; gap:1px; }
.tb {
  font-family:'Oswald',sans-serif; font-weight:700; font-size:11px;
  padding:4px 10px; border:none; border-radius:0; cursor:pointer;
  background:transparent; color:var(--text-soft); transition:all .15s;
}
.tb.active { background:var(--phase); color:white; }

/* ── PAGE LAYOUT ── */
.page { max-width:1400px; margin:24px auto; padding:0 20px 40px; }
.slide { display:none; }
.slide.active { display:block; }

/* ── STUDENT CARD (fixed slide dimensions) ── */
.sc {
  background:white; border-radius:0;
  box-shadow:0 2px 20px rgba(0,0,0,.08), 0 0 0 1px rgba(0,0,0,.04);
  overflow:visible;
  min-height:0; /* removed aspect-ratio to prevent content clipping */
  min-height:480px;
  display:none;
  flex-direction:column;
}
body.vs .sc { display:flex; }

/* slide body starts directly with the framing note; no separate meta bar */

/* band variants — only active band visible */
.bv { display:none; flex-direction:column; flex:1; min-height:0; }
body.bk2 .bv[data-b="k2"]  { display:flex; }
body.b35  .bv[data-b="35"] { display:flex; }
body.b612 .bv[data-b="612"]{ display:flex; }

/* slide body */
.sb {
  flex:1; min-height:0;
  display:flex; flex-direction:column;
  padding:18px 24px 10px;
}
.s-title {
  font-family:'Oswald',sans-serif; font-weight:700; font-size:40px;
  color:var(--text); line-height:1.1; margin-bottom:6px; flex-shrink:0;
}
.s-sub {
  font-size:19px; font-weight:600; color:var(--text-mid);
  margin-bottom:16px; flex-shrink:0;
}

/* ── CARDS ROW — equal height is the key constraint ── */
.cr {
  flex:1; min-height:0;
  display:flex; align-items:stretch; /* <-- all cards stretch to same height */
}
.cw { flex:1; display:flex; }
.pc {
  flex:1;
  border-radius:0;
  padding:14px 12px 12px;
  display:flex; flex-direction:column;
  align-items:center; text-align:center;
  gap:7px;
  overflow:hidden;
}
/* routine = muted dashes; focus = orange dashes */
.pd { border:1px solid var(--border); border-top:3px solid var(--phase); }
.pr { border:1px solid var(--border); border-top:3px solid var(--amber); background:#FFFCF9; }

.card-arrow {
  flex:0 0 20px; display:flex; align-items:center; justify-content:center;
  color:var(--phase); font-size:16px; font-weight:700; flex-shrink:0;
}

/* card internals */
.cm { display:flex; align-items:center; justify-content:space-between; width:100%; }
.mode-pill {
  font-family:'Oswald',sans-serif; font-weight:700; font-size:12px;
  letter-spacing:.05em; padding:3px 9px; border-radius:0; white-space:nowrap;
}
.m-ind  { background:var(--m-ind-bg);  border:1px solid var(--m-ind-b);  color:var(--m-ind-t); }
.m-pair { background:var(--m-pair-bg); border:1px solid var(--m-pair-b); color:var(--m-pair-t); }
.m-sm   { background:var(--m-sm-bg);   border:1px solid var(--m-sm-b);   color:var(--m-sm-t); }
.m-wh   { background:var(--m-wh-bg);   border:1px solid var(--m-wh-b);   color:var(--m-wh-t); }
.c-time { font-family:'Oswald',sans-serif; font-weight:700; font-size:13px; color:var(--text-soft); }
.c-icon { font-size:34px; line-height:1; flex-shrink:0; }
.c-label {
  font-family:'Oswald',sans-serif; font-weight:700; font-size:20px; color:var(--text);
  flex-shrink:0;
}
.c-prompt { font-size:17px; color:var(--text-mid); line-height:1.4; }
.c-starter { font-size:15px; color:var(--text-soft); font-style:italic; line-height:1.35; }

/* ── TEACHER CARD (fixed slide dimensions) ── */
.tc2 {
  background:var(--t-bg); border-radius:0;
  box-shadow:0 2px 20px rgba(0,0,0,.2);
  overflow:hidden;
  min-height:0; /* removed aspect-ratio to prevent content clipping */
  min-height:500px;
  display:none;
  flex-direction:column;
}
body.vt .tc2 { display:flex; }

.t-hdr {
  flex:0 0 auto;
  background:var(--phase); padding:15px 24px;
  display:flex; align-items:flex-start; justify-content:space-between; gap:14px;
}
.t-hdr-l { display:flex; flex-direction:column; gap:3px; }
.t-ey {
  font-family:'Oswald',sans-serif; font-weight:700; font-size:10px;
  letter-spacing:.18em; color:rgba(255,255,255,.75); text-transform:uppercase;
}
.t-ttl { font-family:'Oswald',sans-serif; font-weight:700; font-size:20px; color:white; }
.t-meta {
  display:flex; flex-direction:column; align-items:flex-end; gap:2px;
  background:rgba(0,0,0,.15); border-radius:0; padding:7px 12px; flex-shrink:0;
}
.t-ml { font-family:'Oswald',sans-serif; font-weight:700; font-size:10px; letter-spacing:.12em; color:rgba(255,255,255,.6); text-transform:uppercase; }
.t-mv { font-family:'Oswald',sans-serif; font-weight:700; font-size:13px; color:white; }

.t-body {
  flex:1; min-height:0;
  padding:14px 24px 18px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.t-sec { background:var(--t-s); border-radius:9px; padding:12px 13px; overflow:hidden; }
.g-sec { padding:15px 17px; }
.g-sec .t-sec-title { font-size:11px; margin-bottom:9px; }
.g-sec .g-note { font-size:13.5px; line-height:1.5; }
.h-sec { padding:8px 13px; }
.h-sec .h-name { font-size:12px; }
.h-sec .h-rat { font-size:11.5px; }
.t-sec-title {
  font-family:'Oswald',sans-serif; font-weight:700; font-size:9.5px;
  letter-spacing:.14em; text-transform:uppercase; color:var(--phase); margin-bottom:8px;
}

/* hattie rows */
.h-row {
  display:flex; align-items:flex-start; gap:8px;
  padding:6px 0; border-bottom:1px solid var(--t-l);
}
.h-row:last-of-type { border-bottom:none; padding-bottom:0; }
.h-badge {
  flex-shrink:0; background:rgba(230,145,56,.18); border:1px solid rgba(230,145,56,.35);
  border-radius:0; padding:3px 6px; text-align:center; min-width:42px;
}
.h-d { font-family:'Oswald',sans-serif; font-weight:700; font-size:13px; color:#f2cd9e; line-height:1; }
.h-lbl { font-family:'Oswald',sans-serif; font-weight:700; font-size:8px; color:rgba(230,145,56,.7); letter-spacing:.05em; }
.h-name { font-family:'Oswald',sans-serif; font-weight:700; font-size:13px; color:#f2cd9e; margin-bottom:2px; }
.h-rat { font-size:12px; color:var(--t-soft); line-height:1.35; }

/* grade notes */
.g-row {
  display:flex; align-items:flex-start; gap:7px;
  padding:4px 0; border-bottom:1px solid var(--t-l);
}
.g-row:last-child { border-bottom:none; padding-bottom:0; }
.g-band {
  font-family:'Oswald',sans-serif; font-weight:700; font-size:9px; letter-spacing:.08em;
  color:var(--phase); background:rgba(230,145,56,.12); border-radius:3px;
  padding:2px 6px; white-space:nowrap; flex-shrink:0; margin-top:1px;
}
.g-note { font-size:12px; color:var(--t-soft); line-height:1.4; }

/* planning note */
.plan-note {
  background:rgba(255,255,255,.04); border:1px solid var(--t-l);
  border-radius:0; padding:8px 11px;
}
.plan-title { font-family:'Oswald',sans-serif; font-weight:700; font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:rgba(255,255,255,.4); margin-bottom:4px; }
.plan-txt { font-size:12px; color:var(--t-soft); line-height:1.4; }

/* why now — spans both columns */
.why-box {
  grid-column:1/-1;
  border-left:3px solid var(--phase); background:rgba(230,145,56,.09);
  border-radius:0 9px 9px 0; padding:10px 13px;
}
.why-l { font-family:'Oswald',sans-serif; font-weight:700; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--phase); margin-bottom:3px; }
.why-t { font-size:13px; color:var(--t-text); line-height:1.55; }

/* standards row */
.std-row {
  grid-column:1/-1;
  display:flex; align-items:flex-start; gap:8px;
  padding-top:9px; border-top:1px solid var(--t-l);
}
.std-l { font-family:'Oswald',sans-serif; font-weight:700; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--phase); white-space:nowrap; padding-top:1px; }
.std-v { font-size:12px; color:var(--t-soft); line-height:1.45; }

/* ── PRINT / PDF ── */
@media print {
  @page { size: A4 landscape; margin: 12mm; }
  .topbar, .page > :not(.slide.active) { display:none !important; }
  .page { margin:0; padding:0; max-width:100%; }
  .slide.active { display:block !important; }
  .sc { display:flex !important; box-shadow:none; width:100%; min-height:0; }
  .tc2 { display:none !important; }
  body.vt .sc { display:none !important; }
  body.vt .tc2 { display:flex !important; }
}
  .page { margin:0; padding:0; max-width:100%; }
  .slide { display:block !important; page-break-after:always; }
  .sc, .tc2 { display:flex !important; box-shadow:none; border-radius:0; }
  body.vs .tc2, body.vt .sc { display:none !important; }
}

/* ── COVER SLIDE ── */
.cover-slide {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-height:calc(100vh - 56px);
  background:linear-gradient(145deg,#C2410C 0%,#F97316 50%,#FB923C 100%);
  position:relative; overflow:hidden; text-align:center; padding:40px;
}
.cover-slide::before {
  content:''; position:absolute; inset:0;
  background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/svg%3E");
}
.cv-badge {
  font-weight:700; font-size:11px; letter-spacing:3px;
  background:rgba(255,255,255,.2); color:#fff; padding:6px 18px;
  border-radius:0; text-transform:uppercase; margin-bottom:28px;
  border:1px solid rgba(255,255,255,.35); position:relative;
}
.cv-title {
  font-family:'Oswald',sans-serif; font-weight:700; font-size:90px;
  color:#fff; line-height:.9; letter-spacing:-2px; position:relative;
}
.cv-sub {
  font-size:22px; font-weight:700; color:rgba(255,255,255,.85);
  margin-top:18px; letter-spacing:.5px; position:relative;
}
.cv-logo {
  position:absolute; bottom:32px; right:36px;
  display:flex; align-items:center; gap:10px;
}
.cv-logo-text {
  font-size:10px; font-weight:700; color:rgba(255,255,255,.6);
  letter-spacing:1.5px; text-transform:uppercase; text-align:right; line-height:1.4;
}
.cv-logo img { width:56px; height:56px; border-radius:50%; object-fit:cover; }

/* ── Individual protocol page overrides ── */
.slide { display:block; }
.back-btn {
  display:inline-flex; align-items:center; gap:5px;
  font-family:'Oswald',sans-serif; font-weight:700; font-size:12px;
  color:var(--text-soft); text-decoration:none; padding:5px 10px 5px 6px;
  border-radius:0; border:1.5px solid var(--border); background:white;
  transition:all .15s;
}
.back-btn:hover { border-color:var(--phase); color:var(--phase); }

.print-btn {
  font-family:'Oswald',sans-serif; font-weight:500; font-size:11px;
  letter-spacing:.1em; text-transform:uppercase;
  padding:5px 12px; border:1px solid var(--border);
  background:white; color:var(--text-mid); cursor:pointer;
  display:inline-flex; align-items:center; gap:6px; transition:all .15s;
  border-radius:0; white-space:nowrap;
}
.print-btn:hover { border-color:var(--phase); color:var(--phase); }
.print-btn svg { flex-shrink:0; }

.student-when { display:flex; align-items:flex-start; gap:10px; padding:9px 24px; background:rgba(0,0,0,.04); border-bottom:1px solid rgba(0,0,0,.08); flex-shrink:0; }
.student-when-icon { font-size:14px; margin-top:1px; flex-shrink:0; }
.student-when-text { font-size:12.5px; color:var(--phase); line-height:1.4; font-weight:600; }
</style>
</head>

      '912':'Most students will need a modeled example of an \u201cassumed\u201d belief vs. an \u201cunknown\u201d before they can distinguish them reliably.'
    },
    planning: 'Anchor chart structure: three columns: KNOW (What evidence do we have?) / DON\u2019T KNOW (What do we need to figure out?) / NEXT STEPS (How can we learn more or act on this?). Add a date or phase label to each round of contributions so students can trace how thinking shifted. By the end of Discover, a strong chart is the student\u2019s first draft of their performance task.',
    why: 'This routine directly builds the \u201cFrame and Define the Challenge\u201d capacity. Track how the Known column grows and the Unknown column shifts. This progression is the evidence of Discover learning.',
    std:'NGSS SEP 1, SEP 8 \u00b7 C3 D1 \u00b7 CCSS W.7, SL.1'
  }
}
];

function buildCard(step, isRoutine) {
  const dc  = isRoutine ? 'pr' : 'pd';
  const mc  = MC[step.mode] || 'm-wh';
  const ml  = ML[step.mode] || step.mode;
  const str = step.starter
    ? `<div class="c-starter">${step.starter}</div>` : '';
  return `<div class="cw"><div class="pc ${dc}">
    <div class="cm">
      <span class="mode-pill ${mc}">${ml}</span>
      <span class="c-time">\u23F3\u202F${step.time}</span>
    </div>
    <div class="c-icon">${step.icon}</div>
    <div class="c-label">${step.label}</div>
    <div class="c-prompt">${step.prompt}</div>
    ${str}
  </div></div>`;
}

function buildBand(proto, band) {
  const ir    = proto.type === 'routine';
  let   cards = '';
  proto.bands[band].forEach((s, i) => {
    cards += buildCard(s, ir);
    if (i < proto.bands[band].length - 1)
      cards += `<div class="card-arrow">\u203A</div>`;
  });
  return `<div class="bv" data-b="${band}">
    <div class="sb">
      <div class="s-title">${proto.name}</div>
            <div class="cr">${cards}</div>
    </div>
  </div>`;
}

function buildTeacher(proto) {
  const t = proto.teacher;

  const hattiRows = t.hattie.map(h => `<div class="h-row">
    <div class="h-badge"><div class="h-d">d=${h.d}</div><div class="h-lbl">Hattie</div></div>
    <div><div class="h-name">${h.n}</div><div class="h-rat">${h.r}</div></div>
  </div>`).join('');

  const gradeRows = [
    { key:'k2', label:'K\u20132' }, { key:'35', label:'3\u20135' },
    { key:'68', label:'6\u20138' }, { key:'912', label:'9\u201312' }
  ].map(g => `<div class="g-row">
    <span class="g-band">${g.label}</span>
    <span class="g-note">${t.grade[g.key]}</span>
  </div>`).join('');

  const planNote = t.planning ? `<div class="plan-note">
    <div class="plan-title">Planning Notes</div>
    <div class="plan-txt">${t.planning}</div>
  </div>` : '';

  return `<div class="tc2">
    <div class="t-hdr">
      <div class="t-hdr-l">
        <div class="t-ey">Teacher Background: Discover</div>
        <div class="t-ttl">${proto.name}</div>
      </div>
      <div class="t-meta">
        <div class="t-ml">When to use</div><div class="t-mv">${t.when}</div>
        <div class="t-ml" style="margin-top:4px">Type</div><div class="t-mv">${t.type}</div>
      </div>
    </div>
    <div class="t-body">
      <div class="why-box">
        <div class="why-l">Why this, why now</div>
        <div class="why-t">${t.why}</div>
      </div>
      <div class="t-sec g-sec">
        <div class="t-sec-title">Grade Band Guidance</div>
        ${gradeRows}
        ${planNote}
      </div>
      <div class="t-sec h-sec">
        <div class="t-sec-title">Hattie Effect Sizes</div>
        ${hattiRows}
      </div>
      <div class="std-row">
        <div class="std-l">Standards</div>
        <div class="std-v">${t.std}</div>
      </div>
    </div>
  </div>`;
}

function buildAll() {
  const allBands = ['k2','35','612'];
  const bvs = allBands.map(b => buildBand(P[0], b)).join('');
  document.getElementById('slide0').innerHTML = `
    <div class="sc">
      ${P[0].teacher.studentWhen ? `<div class="student-when"><span class="student-when-icon">💡</span><span class="student-when-text">${P[0].teacher.studentWhen}</span></div>` : ""}
      ${bvs}
    </div>
    ${buildTeacher(P[0])}`;
  document.getElementById('tmr0').textContent = '\u23F1\u202F' + P[0].timer['k2'];
}

buildAll();

function setView(v) {
  document.body.classList.toggle('vs', v === 's');
  document.body.classList.toggle('vt', v === 't');
  document.getElementById('bvs').classList.toggle('active', v === 's');
  document.getElementById('bvt').classList.toggle('active', v === 't');
}

function setBand(b) {
  document.body.className = document.body.className.replace(/\bb(k2|35|612|68|912)\b/g,'').trim() + ' b' + b;
  ['k2','35','612'].forEach(x => {
    const btn = document.getElementById('bb'+x);
    if(btn) btn.classList.toggle('active', x === b);
  });
  const el = document.getElementById('tmr0');
  if(el) el.textContent = '\u23F1\u202F' + (P[0].timer[b] || P[0].timer['35'] || P[0].timer['k2']);
}
document.addEventListener('keydown', e => {
  if(e.key==='ArrowLeft'||e.key==='ArrowRight') return;
});

</script>
</body>
</html>
